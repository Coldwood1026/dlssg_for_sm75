; Original dlssg_sm86 proxy + OUR sm75 backend, via Pinned/Backends.
; Deploy this folder's contents beside the W3 rendering EXE (overwrite old files).
[General]
Enabled=1

[FrameGeneration]
MaxGeneratedFrames=3

[Logging]
Level=3
File=1
DebugOutput=0
EvaluateEvery=120
Directory=dlssg_sm86\logs

[Debug]
MarkGeneratedFrames=0
MarkerX=8
MarkerY=8
MarkerScale=2

[Compatibility]
; Auto on a forced route -> PTX (driver JIT of our sm75 PTX). Try Cubin later if needed.
KernelImage=Cubin
ForceSM86Route=1
SimulateAmpere=1

[Runtime]
; Pinned: load Path (310.1, same SHA c989c0eb..) + a matching backend from [Backends].
Mode=Pinned
CacheDirectory=
Path=runtime\nvngx_dlssg.dll

[Backends]
; key = full SHA256 of the runtime DLL above; value = our sm75 backend
c989c0ebd9cd21dbf3db0becd857aa1f218068d94da371d924331a6f0fb97525=runtime\sm75_backend.dll
